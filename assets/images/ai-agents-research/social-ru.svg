<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title" xml:lang="ru">
  <title id="title">Три шага: описать задачу или область; дать статьи и инструменты; поручить рою агентов двигаться вперёд без остановки, с проверкой новым агентом, записью результатов и проверкой доказательством или расчётом.</title>
  <!-- Verbatim export of the article's research-steps list. Keep all three languages in sync. -->
  <rect width="1200" height="500" fill="#2e2d2b"/>
  <g class="step" font-family="DejaVu Sans Condensed, sans-serif">
    <rect x="30" y="20" width="340" height="460" rx="12" fill="#363531" stroke="#5b5445"/>
    <text x="62" y="88" fill="#d4c294" font-size="36" font-weight="bold">01</text>
    <text x="62" y="139" fill="#d4c294" font-size="22" font-weight="bold">Описать задачу или</text>
    <text x="62" y="170" fill="#d4c294" font-size="22" font-weight="bold">область.</text>
    <text x="62" y="218" fill="#ceb888" font-size="20">Столько контекста, сколько</text>
    <text x="62" y="250" fill="#ceb888" font-size="20">нужно для работы, и</text>
    <text x="62" y="282" fill="#ceb888" font-size="20">свобода браться за любые</text>
    <text x="62" y="314" fill="#ceb888" font-size="20">идеи.</text>
  </g>
  <path d="M 390 250 h 20 m -7 -6 l 7 6 -7 6" fill="none" stroke="#d4c294" stroke-width="1.5"/>
  <g class="step" font-family="DejaVu Sans Condensed, sans-serif">
    <rect x="430" y="20" width="340" height="460" rx="12" fill="#363531" stroke="#5b5445"/>
    <text x="462" y="88" fill="#d4c294" font-size="36" font-weight="bold">02</text>
    <text x="462" y="139" fill="#d4c294" font-size="22" font-weight="bold">Дать статьи и</text>
    <text x="462" y="170" fill="#d4c294" font-size="22" font-weight="bold">инструменты.</text>
    <text x="462" y="218" fill="#ceb888" font-size="20">И разрешить искать новые.</text>
  </g>
  <path d="M 790 250 h 20 m -7 -6 l 7 6 -7 6" fill="none" stroke="#d4c294" stroke-width="1.5"/>
  <g class="step" font-family="DejaVu Sans Condensed, sans-serif">
    <rect x="830" y="20" width="340" height="460" rx="12" fill="#363531" stroke="#5b5445"/>
    <text x="862" y="88" fill="#d4c294" font-size="36" font-weight="bold">03</text>
    <text x="862" y="139" fill="#d4c294" font-size="22" font-weight="bold">Поручить рою агентов</text>
    <text x="862" y="170" fill="#d4c294" font-size="22" font-weight="bold">двигаться вперёд без</text>
    <text x="862" y="201" fill="#d4c294" font-size="22" font-weight="bold">остановки.</text>
    <text x="862" y="249" fill="#ceb888" font-size="20">Каждый результат</text>
    <text x="862" y="281" fill="#ceb888" font-size="20">проверяет новый агент. Всё</text>
    <text x="862" y="313" fill="#ceb888" font-size="20">записывается. Где можно —</text>
    <text x="862" y="345" fill="#ceb888" font-size="20">проверка доказательством</text>
    <text x="862" y="377" fill="#ceb888" font-size="20">или расчётом.</text>
  </g>
</svg>
