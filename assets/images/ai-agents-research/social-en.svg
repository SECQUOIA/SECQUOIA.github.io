<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title" xml:lang="en">
  <title id="title">Three steps: describe the problem or field; provide papers and tools; ask a swarm of agents to make progress without stopping, with fresh-agent review, write-ups, and verification.</title>
  <!-- Verbatim export of the article's research-steps list. Keep all three languages in sync. -->
  <rect width="1200" height="500" fill="#2e2d2b"/>
  <g class="step" font-family="DejaVu Sans Condensed, sans-serif">
    <rect x="30" y="20" width="340" height="460" rx="12" fill="#363531" stroke="#5b5445"/>
    <text x="62" y="88" fill="#d4c294" font-size="36" font-weight="bold">01</text>
    <text x="62" y="139" fill="#d4c294" font-size="22" font-weight="bold">Describe the problem or</text>
    <text x="62" y="170" fill="#d4c294" font-size="22" font-weight="bold">field.</text>
    <text x="62" y="218" fill="#ceb888" font-size="20">Enough context to work from;</text>
    <text x="62" y="250" fill="#ceb888" font-size="20">freedom to explore any idea.</text>
  </g>
  <path d="M 390 250 h 20 m -7 -6 l 7 6 -7 6" fill="none" stroke="#d4c294" stroke-width="1.5"/>
  <g class="step" font-family="DejaVu Sans Condensed, sans-serif">
    <rect x="430" y="20" width="340" height="460" rx="12" fill="#363531" stroke="#5b5445"/>
    <text x="462" y="88" fill="#d4c294" font-size="36" font-weight="bold">02</text>
    <text x="462" y="139" fill="#d4c294" font-size="22" font-weight="bold">Provide papers and</text>
    <text x="462" y="170" fill="#d4c294" font-size="22" font-weight="bold">tools.</text>
    <text x="462" y="218" fill="#ceb888" font-size="20">And permission to get more.</text>
  </g>
  <path d="M 790 250 h 20 m -7 -6 l 7 6 -7 6" fill="none" stroke="#d4c294" stroke-width="1.5"/>
  <g class="step" font-family="DejaVu Sans Condensed, sans-serif">
    <rect x="830" y="20" width="340" height="460" rx="12" fill="#363531" stroke="#5b5445"/>
    <text x="862" y="88" fill="#d4c294" font-size="36" font-weight="bold">03</text>
    <text x="862" y="139" fill="#d4c294" font-size="22" font-weight="bold">Ask a swarm of agents</text>
    <text x="862" y="170" fill="#d4c294" font-size="22" font-weight="bold">to make progress, and</text>
    <text x="862" y="201" fill="#d4c294" font-size="22" font-weight="bold">not to stop.</text>
    <text x="862" y="249" fill="#ceb888" font-size="20">Every result reviewed by a</text>
    <text x="862" y="281" fill="#ceb888" font-size="20">fresh agent. Write it up. Verify</text>
    <text x="862" y="313" fill="#ceb888" font-size="20">by proof or by computation</text>
    <text x="862" y="345" fill="#ceb888" font-size="20">where possible.</text>
  </g>
</svg>
