<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title" xml:lang="es">
  <title id="title">Tres pasos: describir el problema o el campo; proporcionar artículos y herramientas; pedir a un enjambre de agentes que avance sin detenerse, con revisión por un agente nuevo, redacción y verificación.</title>
  <!-- Verbatim export of the article's research-steps list. Keep all three languages in sync. -->
  <rect width="1200" height="500" fill="#2e2d2b"/>
  <g class="step" font-family="DejaVu Sans Condensed, sans-serif">
    <rect x="30" y="20" width="340" height="460" rx="12" fill="#363531" stroke="#5b5445"/>
    <text x="62" y="88" fill="#d4c294" font-size="36" font-weight="bold">01</text>
    <text x="62" y="139" fill="#d4c294" font-size="22" font-weight="bold">Describir el problema o</text>
    <text x="62" y="170" fill="#d4c294" font-size="22" font-weight="bold">el campo.</text>
    <text x="62" y="218" fill="#ceb888" font-size="20">Contexto suficiente para</text>
    <text x="62" y="250" fill="#ceb888" font-size="20">empezar; libertad para</text>
    <text x="62" y="282" fill="#ceb888" font-size="20">explorar cualquier idea.</text>
  </g>
  <path d="M 390 250 h 20 m -7 -6 l 7 6 -7 6" fill="none" stroke="#d4c294" stroke-width="1.5"/>
  <g class="step" font-family="DejaVu Sans Condensed, sans-serif">
    <rect x="430" y="20" width="340" height="460" rx="12" fill="#363531" stroke="#5b5445"/>
    <text x="462" y="88" fill="#d4c294" font-size="36" font-weight="bold">02</text>
    <text x="462" y="139" fill="#d4c294" font-size="22" font-weight="bold">Proporcionar artículos y</text>
    <text x="462" y="170" fill="#d4c294" font-size="22" font-weight="bold">herramientas.</text>
    <text x="462" y="218" fill="#ceb888" font-size="20">Y permiso para conseguir</text>
    <text x="462" y="250" fill="#ceb888" font-size="20">más.</text>
  </g>
  <path d="M 790 250 h 20 m -7 -6 l 7 6 -7 6" fill="none" stroke="#d4c294" stroke-width="1.5"/>
  <g class="step" font-family="DejaVu Sans Condensed, sans-serif">
    <rect x="830" y="20" width="340" height="460" rx="12" fill="#363531" stroke="#5b5445"/>
    <text x="862" y="88" fill="#d4c294" font-size="36" font-weight="bold">03</text>
    <text x="862" y="139" fill="#d4c294" font-size="22" font-weight="bold">Pedir a un enjambre de</text>
    <text x="862" y="170" fill="#d4c294" font-size="22" font-weight="bold">agentes que avance y</text>
    <text x="862" y="201" fill="#d4c294" font-size="22" font-weight="bold">que no se detenga.</text>
    <text x="862" y="249" fill="#ceb888" font-size="20">Que un agente nuevo revise</text>
    <text x="862" y="281" fill="#ceb888" font-size="20">cada resultado. Redactarlo.</text>
    <text x="862" y="313" fill="#ceb888" font-size="20">Verificarlo mediante una</text>
    <text x="862" y="345" fill="#ceb888" font-size="20">demostración o mediante</text>
    <text x="862" y="377" fill="#ceb888" font-size="20">cálculos siempre que sea</text>
    <text x="862" y="409" fill="#ceb888" font-size="20">posible.</text>
  </g>
</svg>
