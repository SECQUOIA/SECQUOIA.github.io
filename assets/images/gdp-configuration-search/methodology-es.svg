<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#202122"/><text x="50" y="70" font-family="DejaVu Sans Condensed" font-size="34" fill="#f4f0e8">El ciclo de búsqueda de configuraciones</text><text x="50" y="112" font-family="DejaVu Sans Condensed" font-size="20" fill="#ceb888">GDP + DFO</text><g class="step"><rect x="45" y="150" width="350" height="430" rx="14" fill="#292a2b" stroke="#ceb888"/><text x="70" y="215" font-family="DejaVu Sans Condensed" font-size="39" fill="#ceb888">01</text><text x="70" y="285" font-family="DejaVu Sans Condensed" font-size="27" fill="#f4f0e8">Proponer una</text><text x="70" y="320" font-family="DejaVu Sans Condensed" font-size="27" fill="#f4f0e8">configuración.</text><text x="70" y="405" font-family="DejaVu Sans Condensed" font-size="24" fill="#f4f0e8">Seleccionar las</text><text x="70" y="434" font-family="DejaVu Sans Condensed" font-size="24" fill="#f4f0e8">alternativas de equipos</text><text x="70" y="463" font-family="DejaVu Sans Condensed" font-size="24" fill="#f4f0e8">que el modelo evaluará.</text></g><path d="M402 365 h15 m-6 -6 6 6 -6 6" fill="none" stroke="#ceb888" stroke-width="2"/><g class="step"><rect x="425" y="150" width="350" height="430" rx="14" fill="#292a2b" stroke="#ceb888"/><text x="450" y="215" font-family="DejaVu Sans Condensed" font-size="39" fill="#ceb888">02</text><text x="450" y="285" font-family="DejaVu Sans Condensed" font-size="27" fill="#f4f0e8">Evaluar el diseño</text><text x="450" y="320" font-family="DejaVu Sans Condensed" font-size="27" fill="#f4f0e8">seleccionado.</text><text x="450" y="405" font-family="DejaVu Sans Condensed" font-size="24" fill="#f4f0e8">Optimizar o simular esa</text><text x="450" y="434" font-family="DejaVu Sans Condensed" font-size="24" fill="#f4f0e8">configuración y devolver</text><text x="450" y="463" font-family="DejaVu Sans Condensed" font-size="24" fill="#f4f0e8">su desempeño.</text></g><path d="M782 365 h15 m-6 -6 6 6 -6 6" fill="none" stroke="#ceb888" stroke-width="2"/><g class="step"><rect x="805" y="150" width="350" height="430" rx="14" fill="#292a2b" stroke="#ceb888"/><text x="830" y="215" font-family="DejaVu Sans Condensed" font-size="39" fill="#ceb888">03</text><text x="830" y="285" font-family="DejaVu Sans Condensed" font-size="27" fill="#f4f0e8">Elegir la siguiente</text><text x="830" y="320" font-family="DejaVu Sans Condensed" font-size="27" fill="#f4f0e8">configuración.</text><text x="830" y="405" font-family="DejaVu Sans Condensed" font-size="24" fill="#f4f0e8">Usar los resultados</text><text x="830" y="434" font-family="DejaVu Sans Condensed" font-size="24" fill="#f4f0e8">acumulados para orientar</text><text x="830" y="463" font-family="DejaVu Sans Condensed" font-size="24" fill="#f4f0e8">la siguiente propuesta.</text></g></svg>
