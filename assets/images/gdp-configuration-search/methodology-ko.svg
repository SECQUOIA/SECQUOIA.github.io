<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#202122"/><text x="50" y="70" font-family="Noto Sans CJK KR" font-size="34" fill="#f4f0e8">구성 탐색의 반복 과정</text><text x="50" y="112" font-family="Noto Sans CJK KR" font-size="20" fill="#ceb888">GDP + DFO</text><g class="step"><rect x="45" y="150" width="350" height="430" rx="14" fill="#292a2b" stroke="#ceb888"/><text x="70" y="215" font-family="Noto Sans CJK KR" font-size="39" fill="#ceb888">01</text><text x="70" y="285" font-family="Noto Sans CJK KR" font-size="27" fill="#f4f0e8">구성을 제안한다.</text><text x="70" y="405" font-family="Noto Sans CJK KR" font-size="24" fill="#f4f0e8">모델이 평가할 장치 구성을</text><text x="70" y="434" font-family="Noto Sans CJK KR" font-size="24" fill="#f4f0e8">선택한다.</text></g><path d="M402 365 h15 m-6 -6 6 6 -6 6" fill="none" stroke="#ceb888" stroke-width="2"/><g class="step"><rect x="425" y="150" width="350" height="430" rx="14" fill="#292a2b" stroke="#ceb888"/><text x="450" y="215" font-family="Noto Sans CJK KR" font-size="39" fill="#ceb888">02</text><text x="450" y="285" font-family="Noto Sans CJK KR" font-size="27" fill="#f4f0e8">선택한 설계를 평가한다.</text><text x="450" y="405" font-family="Noto Sans CJK KR" font-size="24" fill="#f4f0e8">해당 구성을 최적화하거나</text><text x="450" y="434" font-family="Noto Sans CJK KR" font-size="24" fill="#f4f0e8">시뮬레이션하여 성능을</text><text x="450" y="463" font-family="Noto Sans CJK KR" font-size="24" fill="#f4f0e8">반환한다.</text></g><path d="M782 365 h15 m-6 -6 6 6 -6 6" fill="none" stroke="#ceb888" stroke-width="2"/><g class="step"><rect x="805" y="150" width="350" height="430" rx="14" fill="#292a2b" stroke="#ceb888"/><text x="830" y="215" font-family="Noto Sans CJK KR" font-size="39" fill="#ceb888">03</text><text x="830" y="285" font-family="Noto Sans CJK KR" font-size="27" fill="#f4f0e8">다음 구성을 선택한다.</text><text x="830" y="405" font-family="Noto Sans CJK KR" font-size="24" fill="#f4f0e8">축적된 결과를 활용하여 다음</text><text x="830" y="434" font-family="Noto Sans CJK KR" font-size="24" fill="#f4f0e8">제안을 정한다.</text></g></svg>
