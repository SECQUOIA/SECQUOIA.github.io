<html lang="en">

{% include head.html %}

<body>

    {% include header.html %}

    <!-- Banner -->
    <section id="banner" class="major">
        <div class="inner">
            <header class="major">
                <h1>{{ page.landing-title }}</h1>
            </header>
            <div class="content">
                <p style="text-transform: uppercase;">{{ site.description }}</p>
            </div>
        </div>
    </section>

    <!-- Main -->
    <main id="main" tabindex="-1">

        <!-- One -->
        <section id="one">
            <div class="inner">
                <header class="major">
                    <h2>Who are we?</h2>
                </header>
                {{ content }}
            </div>
        </section>

        <!-- Two -->
        {% include tiles.html %}

    </main>

    {% include footer.html %}

</body>

</html>
