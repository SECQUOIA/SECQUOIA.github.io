<html lang="en">

{% include head.html %}

<body>
	{% include header.html %}

	<main id="main" class="alt">
		<section id="cv_pdf">
			<div class="inner">
				<header class="major">
					<h1>{{ page.title }}</h1>
				</header>
				<ul class="actions">
					<li><a href="{{ page.pdf_url | relative_url }}" class="button special icon fa-download" target="_blank" rel="noopener noreferrer">Download / Open PDF</a></li>
					<li><a href="{{ page.return_url | relative_url }}" class="button icon fa-arrow-left">Go back</a></li>
				</ul>
				<noscript>
					<p>JavaScript is disabled or the embedded PDF viewer could not load. You can <a href="{{ page.pdf_url | relative_url }}">open or download {{ page.pdf_name | default: 'the PDF' }} directly</a>.</p>
				</noscript>
				<p class="pdf-fallback-note">If the embedded viewer below does not load in your browser or local preview, use <a href="{{ page.pdf_url | relative_url }}" target="_blank" rel="noopener noreferrer">Download / Open PDF</a> above.</p>
				<div id="adobe-dc-view" style="width: 100%;"></div>
				<script src="https://documentservices.adobe.com/view-sdk/viewer.js"></script>
				<script type="text/javascript">
					document.addEventListener("adobe_dc_view_sdk.ready", function() {
						var adobeDCView = new AdobeDC.View({clientId: "2c9a51045899496dbfdb274e2feb2f4c", divId: "adobe-dc-view"});
						adobeDCView.previewFile({
							content: {location: {url: "{{ page.pdf_url | relative_url }}"}},
							metaData: {fileName: "{{ page.pdf_name }}"}
						}, {embedMode: "IN_LINE", showDownloadPDF: true});
					});
				</script>
				<ul class="actions">
					<li><a href="{{ page.return_url | relative_url }}" class="button icon fa-arrow-left">Go back</a></li>
				</ul>
			</div>
		</section>
	</main>

	{% include footer.html %}

</body>

</html>
