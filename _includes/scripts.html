<!-- Deferred JavaScript loading for syntax highlighting and PWA support -->
<script>
window.addEventListener('load', function() {
  function loadScript(src) {
    return new Promise(function(resolve, reject) {
      var scriptEl = document.createElement('script');
      scriptEl.src = src;
      scriptEl.async = true;
      scriptEl.onload = resolve;
      scriptEl.onerror = reject;
      document.head.appendChild(scriptEl);
    });
  }

  if (document.querySelectorAll('pre code, code[class*="language-"]').length > 0) {
    loadScript('https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js')
      .then(function() {
        return Promise.all([
          loadScript('https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/languages/julia.min.js'),
          loadScript('https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/languages/r.min.js')
        ]);
      })
      .then(function() {
        if (window.hljs && typeof window.hljs.highlightAll === 'function') {
          window.hljs.highlightAll();
        }
      })
      .catch(function(error) {
        console.warn('Syntax highlighting failed to load:', error);
      });
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('{{ "/sw.js" | relative_url }}').catch(function() {});
  }
});
</script>
