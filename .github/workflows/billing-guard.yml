name: Billing Guard

# Early warning for billable GitHub usage on the SECQUOIA org.
#
# Context: in Aug 2026 GitHub Advanced Security "Secret Protection" was enabled
# on this free-plan org and quietly accrued $19/committer/month. The unpaid
# balance locked the org, which blocked every Actions job with
# "your account is locked due to a billing issue". Nobody noticed for ~4 weeks.
#
# This job is a DETECTOR, not a preventer. The only hard guarantee is a $0
# spending limit, set in the billing UI:
#   https://github.com/organizations/SECQUOIA/settings/billing
#
# Setup: create a fine-grained or classic PAT with read access to org billing
# (classic: admin:org) and store it as the repo/org secret BILLING_READ_TOKEN.
# Without that secret the job exits quietly, so it never fails CI.

on:
  schedule:
    - cron: '30 7 * * *'   # daily, 07:30 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-billing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORG: SECQUOIA
      # Alert when the month's net billable total exceeds this many USD.
      THRESHOLD_USD: '0'
      # Alert when private-repo equivalent Actions minutes reach 75% of the
      # 2,000-minute Free plan monthly inclusion.
      THRESHOLD_ACTIONS_MINUTES: '1500'
      QUOTA_ACTIONS_MINUTES: '2000'

    steps:
      - name: Check for a billing-read token
        id: token
        env:
          BILLING_READ_TOKEN: ${{ secrets.BILLING_READ_TOKEN }}
        run: |
          if [ -z "${BILLING_READ_TOKEN}" ]; then
            echo "::notice::BILLING_READ_TOKEN is not set -" \
              "skipping billing check."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Query org billing usage
        id: usage
        if: steps.token.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.BILLING_READ_TOKEN }}
        run: |
          set -euo pipefail
          YEAR=$(date -u +%Y)
          MONTH=$(date -u +%-m)

          ENDPOINT="/organizations/${ORG}/settings/billing/usage"
          if ! gh api "${ENDPOINT}?year=${YEAR}&month=${MONTH}" \
                 > usage.json 2> usage.err; then
            echo "::warning::Could not read billing usage for ${ORG}." \
              "$(cat usage.err)"
            echo "status=unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TOTAL=$(jq '[.usageItems[].netAmount]
            | add // 0 | .*100 | round / 100' usage.json)
          echo "Net billable total for ${YEAR}-${MONTH}: \$${TOTAL}"

          jq -r '
            [.usageItems[] | select(.netAmount > 0)]
            | group_by(.product + "|" + .sku)[]
            | ((map(.netAmount) | add) * 100 | round / 100) as $net
            | "| \(.[0].product) | \(.[0].sku) | $\($net) |"
          ' usage.json > breakdown.md || true

          EQUIV_MINUTES=$(jq '
            [
              .usageItems[]
              | select(
                  .product == "actions" and
                  .unitType == "Minutes" and
                  .grossAmount > 0
                )
              | .quantity * (
                  if (.sku | test("MacOS"; "i")) then 10
                  elif (.sku | test("Windows"; "i")) then 2
                  else 1
                  end
                )
            ] | add // 0 | .*10 | round / 10
          ' usage.json)
          echo "Private equivalent Actions minutes: ${EQUIV_MINUTES}"

          jq -r '
            [
              .usageItems[]
              | select(
                  .product == "actions" and
                  .unitType == "Minutes" and
                  .grossAmount > 0
                )
              | {
                  repositoryName,
                  raw: .quantity,
                  equiv: (
                    .quantity * (
                      if (.sku | test("MacOS"; "i")) then 10
                      elif (.sku | test("Windows"; "i")) then 2
                      else 1
                      end
                    )
                  )
                }
            ]
            | group_by(.repositoryName)
            | map({
                repo: .[0].repositoryName,
                raw: ((map(.raw) | add) * 10 | round / 10),
                equiv: ((map(.equiv) | add) * 10 | round / 10)
              })
            | sort_by(-.equiv)[]
            | "| \(.repo) | \(.raw) | \(.equiv) |"
          ' usage.json > actions_breakdown.md || true

          {
            echo "total=${TOTAL}"
            echo "equiv_minutes=${EQUIV_MINUTES}"
            echo "year=${YEAR}"
            echo "month=${MONTH}"
            if awk "BEGIN{exit !(${TOTAL} > ${THRESHOLD_USD} || ${EQUIV_MINUTES} >= ${THRESHOLD_ACTIONS_MINUTES})}"; then
              echo "status=billable"
            else
              echo "status=clean"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Open or update alert issue
        if: steps.usage.outputs.status == 'billable'
        env:
          GH_TOKEN: ${{ github.token }}
          TOTAL: ${{ steps.usage.outputs.total }}
          EQUIV_MINUTES: ${{ steps.usage.outputs.equiv_minutes }}
          YEAR: ${{ steps.usage.outputs.year }}
          MONTH: ${{ steps.usage.outputs.month }}
        run: |
          set -euo pipefail
          MARKER="<!-- billing-guard -->"
          TITLE="Billable GitHub usage or Actions quota warning on ${ORG}"

          {
            echo "$MARKER"
            echo
            echo "**\$${TOTAL}** net billable usage and" \
              "**${EQUIV_MINUTES} / ${QUOTA_ACTIONS_MINUTES}**" \
              "private-repo equivalent Actions minutes have accrued" \
              "on \`${ORG}\` in ${YEAR}-${MONTH}."
            echo
            echo "This org runs on the **free** plan" \
              "(2,000 private equivalent Actions minutes/month," \
              "\$0 expected net billable total)."
            echo
            if [ -s breakdown.md ]; then
              echo "### Net Billable Usage"
              echo
              echo "| Product | SKU | Net |"
              echo "|---|---|---|"
              cat breakdown.md
              echo
            fi
            if [ -s actions_breakdown.md ]; then
              echo "### Private-Repo Actions Quota Usage"
              echo
              echo "| Repository | Raw Minutes | Equivalent Minutes |"
              echo "|---|---|---|"
              cat actions_breakdown.md
              echo
            fi
            echo "**If this is unintended**, review active workflows" \
              "or disable paid products:"
            SETTINGS="https://github.com/organizations/${ORG}/settings"
            echo "- Security products: ${SETTINGS}/security_products"
            echo "- Billing: ${SETTINGS}/billing"
            echo
            echo "Exceeding the 2,000-minute quota blocks all private-repo" \
              "Actions jobs until the next billing cycle."
            echo
            echo "_Updated $(date -u '+%Y-%m-%d %H:%M UTC')" \
              "by the Billing Guard workflow._"
          } > body.md

          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number,body \
                       --jq "[.[] | select(.body | contains(\"$MARKER\"))]
                         | .[0].number // empty")

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body-file body.md
            echo "Updated existing issue #${EXISTING}"
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi

      - name: Report clean
        if: steps.usage.outputs.status == 'clean'
        run: |
          echo "::notice::No billable usage on ${ORG}" \
            "(net \$${{ steps.usage.outputs.total }})."
